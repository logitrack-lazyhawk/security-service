spring:
  application:
    name: security-service
  profiles:
    active: dev
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8085}"
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/security_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: ${SECURITY_DB_PASSWORD:admin123}

security:
  jwt:
    secret-key: ${SECURITY_JWT_PRIVATE_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 3600000
    issuer: "logitrack-security"

server:
  port: 8083