spring:
  application:
    name: security-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    compatibility-verifier:
      enabled: false
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8085}"
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:security_db}?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${SECURITY_DB_USER:${DB_USER:root}}
    password: ${SECURITY_DB_PASSWORD:${DB_PASSWORD:admin123}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

security:
  jwt:
    secret-key: ${SECURITY_JWT_PRIVATE_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 3600000
    issuer: "logitrack-security"

server:
  port: 8083
